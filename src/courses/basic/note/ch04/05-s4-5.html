<h3 id="s4-5"><span class="secno">4.5</span>pass文</h3>
<p><dfn id="t19">pass</dfn> は<mark>何もしない文</mark>です。構文上、何か文が必要だけれど、処理は何もしたくないときに使います。</p>
<span class="inlbl">In</span><pre class="pynr"><code><span class="k">while</span> <span class="kc">True</span><span class="p">:</span>
    <span class="k">pass</span>  <span class="c1"># キーボード割り込み（Ctrl+C）を待つビジーウェイト</span>

<span class="k">class</span><span class="w"> </span><span class="nc">MyEmptyClass</span><span class="p">:</span>
    <span class="k">pass</span>  <span class="c1"># 最小限のクラス</span>

<span class="k">def</span><span class="w"> </span><span class="nf">initlog</span><span class="p">(</span><span class="o">*</span><span class="n">args</span><span class="p">):</span>
    <span class="k">pass</span>  <span class="c1"># あとで実装する（場所取り）</span></code></pre>
