<h3 id="s9-1"><span class="secno">9.1</span>名前とオブジェクトについて一言</h3>
<p>オブジェクトには個別性があり、<mark>1つのオブジェクトに複数の名前を結び付けられます</mark>（他の言語でいう別名＝エイリアス）。数値や文字列のようなイミュータブルなオブジェクトでは気にする必要はありませんが、リストや辞書のような<mark>ミュータブルなオブジェクトでは、一方の名前で変更すると他方の名前からも変更が見えます</mark>。関数にオブジェクトを渡すときは、実際にはポインタが渡されるだけなので低コストで、関数の中で変更すると呼び出し側にも見えます。</p>
